    <!-- MAIN MODEL PAGE -->
    <main class="model-page">
        <div class="container-fluid">
            <div class="row">

                <!-- 3D viewport -->
                <div class="col-lg-8 p-0">
                    <div id="threeContainer" class="three-viewport"></div>
                </div>

                <!-- controls panel, dynamic content loads from data_loader.js -->
                <div class="col-lg-4 controls-panel">
                    <h2 class="model-title" data-content="model-title">Loading...</h2>
                    <p class="model-description" data-content="model-description">Loading...</p>
                    
                    <div class="info-box">
                        <h4><i class="fas fa-info-circle"></i> About this model</h4>
                        <p data-content="model-technical">Loading...</p>
                    </div>

                    <!-- Animation controls -->
                    <div class="controls-group">
                        <h4><i class="fas fa-play-circle"></i> Animation</h4>
                        <div class="btn-grid">
                            <button id="openMacBook" class="btn-3d"><i class="fas fa-laptop"></i> Open</button>
                            <button id="closeMacBook" class="btn-3d"><i class="fas fa-laptop-house"></i> Close</button>
                            <button id="toggleRotate" class="btn-3d"><i class="fas fa-sync-alt"></i> Spin</button>
                            <button id="resetModel" class="btn-3d"><i class="fas fa-undo"></i> Reset</button>
                        </div>
                    </div>

                    <!-- View controls -->
                    <div class="controls-group">
                        <h4><i class="fas fa-eye"></i> View</h4>
                        <div class="btn-grid">
                            <button id="toggleWireframe" class="btn-3d btn-view"><i class="fas fa-border-all"></i> Wireframe</button>
                            <button id="cameraHero" class="btn-3d btn-view"><i class="fas fa-video"></i> Hero View</button>
                            <button id="cameraFront" class="btn-3d btn-view"><i class="fas fa-video"></i> Front</button>
                            <button id="cameraTop" class="btn-3d btn-view"><i class="fas fa-video"></i> Top</button>
                            <button id="cameraSide" class="btn-3d btn-view"><i class="fas fa-video"></i> Side</button>
                        </div>
                    </div>

                    <!-- Body Colour controls -->
                    <div class="controls-group">
                        <h4><i class="fas fa-palette"></i> Body Colour</h4>
                        <div class="btn-grid">
                            <button id="colourSilver" class="btn-3d btn-view"><i class="fas fa-circle"></i> Silver</button>
                            <button id="colourSpaceGrey" class="btn-3d btn-view"><i class="fas fa-circle"></i> Space Grey</button>
                        </div>
                    </div>

                    <!-- Lighting controls -->
                    <div class="controls-group">
                        <h4><i class="fas fa-lightbulb"></i> Lighting</h4>
                        <div class="btn-grid">
                            <button id="toggleStudioLight" class="btn-3d btn-light"><i class="fas fa-sun"></i> Studio</button>
                            <button id="toggleAmbient" class="btn-3d btn-light"><i class="fas fa-adjust"></i> Ambient</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- FOOTER -->
    <footer class="site-footer">

        </div>

    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

    <script src="data_loader.js"></script>
    <script src="macbook_script.js"></script>
</body>
